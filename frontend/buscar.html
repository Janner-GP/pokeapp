<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar · Pokédex</title>
  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="min-h-screen bg-stone-100 text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-4">
      <a href="index.html" class="mr-auto text-lg font-bold tracking-tight">Poké<span class="text-red-600">dex</span></a>
      <a href="index.html" class="text-stone-600 hover:text-stone-900">Listado</a>
      <a href="buscar.html" aria-current="page" class="font-semibold text-red-600">Buscar</a>
      <a href="favoritos.html" class="text-stone-600 hover:text-stone-900">Favoritos</a>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <h1 class="text-3xl font-bold tracking-tight">Buscar pokémon</h1>
    <p class="mt-1 text-stone-600">Escribe parte del nombre o el número exacto.</p>

    <!-- El formulario usa GET: al enviar, la URL queda como buscar.html?q=pika -->
    <form id="formulario" action="buscar.html" method="get" class="mt-6 flex max-w-xl gap-2">
      <label for="q" class="sr-only">Nombre o número</label>
      <input id="q" name="q" type="search" required placeholder="Ej: pika, char, 150"
             class="w-full rounded-md border border-stone-300 bg-white px-3 py-2 placeholder:text-stone-500 focus:border-red-600">
      <button class="rounded-md bg-red-600 px-5 py-2 font-semibold text-white hover:bg-red-700">Buscar</button>
    </form>

    <p id="resumen" class="num mt-6 text-stone-600"></p>
    <ul id="resultados" class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6"></ul>
  </main>

  <script src="js/api.js"></script>
  <script src="js/buscar.js"></script>
</body>
</html>
